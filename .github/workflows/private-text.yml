name: Private text

# The commit hooks only run in clones where someone turned them on, so this looks again at
# everything that reaches GitHub. By then it's public, so a failure here means removing it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the new commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NEWEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has nothing before it, so it's checked from where it left main.
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="$(git merge-base origin/main "$NEWEST" || true)"
          fi
          sh .githooks/check-pushed "$BEFORE" "$NEWEST"
