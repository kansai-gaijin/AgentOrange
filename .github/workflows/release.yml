name: Release

# Every push to main that passes builds a release. The server's updater and
# installed clients pick it up, and clients must install it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest counts. Runs overlapping could otherwise publish an older one last, which would
# make it the latest, moving the server back and leaving PCs on the newer one unable to sync.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGENT_ORANGE_VERSION: 0.1.${{ github.run_number }}

jobs:
  server:
    if: github.ref == 'refs/heads/main' # Started by hand, this could otherwise publish any branch.
    runs-on: ubuntu-24.04 # Same Ubuntu as the server, so the binary's system libraries match.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        working-directory: server
        run: cargo test --locked

      - name: Build
        working-directory: server
        run: cargo build --release --locked

      - name: Collect release files
        run: |
          mkdir dist
          cp server/target/release/agent-orange-server dist/agent-orange-server-linux-x64
          (cd dist && sha256sum agent-orange-server-linux-x64 > agent-orange-server-linux-x64.sha256)
          printf '%s\n' "$AGENT_ORANGE_VERSION" > dist/server-version.txt # How the updater spots a new release.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: dist/

  client:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet publish client/AgentOrange.csproj -c Release -r win-x64 --self-contained -p:Version="$AGENT_ORANGE_VERSION" -o publish

      - name: Package installer and update
        run: |
          dotnet tool install --tool-path .tools vpk --version 1.2.161
          .tools/vpk pack \
            --packId AgentOrange \
            --packTitle "Agent Orange" \
            --packVersion "$AGENT_ORANGE_VERSION" \
            --packDir publish \
            --mainExe AgentOrange.exe \
            --outputDir dist
          rm dist/*-Portable.zip # Portable copies can't update themselves, and updates are mandatory.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client
          path: dist/

  publish:
    needs: [server, client] # Nothing is published unless both sides built.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$AGENT_ORANGE_VERSION" artifacts/server/* artifacts/client/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$AGENT_ORANGE_VERSION" \
            --notes "Built from $GITHUB_SHA"
