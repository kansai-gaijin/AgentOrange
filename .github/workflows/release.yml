name: Release

# Every push to main that passes builds a release. The server's updater and
# installed clients pick it up, and clients must install it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest counts. Runs overlapping could otherwise publish an older one last, which would
# make it the latest, moving the server back and leaving PCs on the newer one unable to sync.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The run number, unless that isn't above the latest release. It starts again from 1 if this
  # workflow is ever recreated, and installed copies only go forward.
  version:
    if: github.ref == 'refs/heads/main' # Started by hand, this could otherwise publish any branch.
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.pick.outputs.number }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          patch="${latest##*.}"
          [[ "$patch" =~ ^[0-9]+$ ]] || patch=0
          number=$(( GITHUB_RUN_NUMBER > patch ? GITHUB_RUN_NUMBER : patch + 1 ))
          echo "number=0.1.$number" >> "$GITHUB_OUTPUT"

  server:
    needs: version
    runs-on: ubuntu-24.04 # Same Ubuntu as the server, so the binary's system libraries match.
    env:
      AGENT_ORANGE_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain is pinned in server/rust-toolchain.toml, which rustup installs from here.
      - name: Test
        working-directory: server
        run: cargo test --locked

      - name: Build
        working-directory: server
        run: cargo build --release --locked

      - name: Collect release files
        run: |
          mkdir dist
          cp server/target/release/agent-orange-server dist/agent-orange-server-linux-x64
          (cd dist && sha256sum agent-orange-server-linux-x64 > agent-orange-server-linux-x64.sha256)
          # The server runs the updater its installed release carries, so one that doesn't parse is never published.
          bash -n server/deploy/update.sh
          cp server/deploy/update.sh dist/agent-orange-update
          (cd dist && sha256sum agent-orange-update > agent-orange-update.sha256)
          printf '%s\n' "$AGENT_ORANGE_VERSION" > dist/server-version.txt # How the updater spots a new release.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: dist/

  client:
    needs: version
    runs-on: windows-2025
    env:
      AGENT_ORANGE_VERSION: ${{ needs.version.outputs.number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Packages come from client/packages.lock.json exactly, so they can't drift between releases.
      - name: Build
        run: dotnet publish client/AgentOrange.csproj -c Release -r win-x64 --self-contained -p:Version="$AGENT_ORANGE_VERSION" -p:RestoreLockedMode=true -o publish

      - name: Package installer and update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install --tool-path .tools vpk --version 1.2.161
          # With the latest release beside it, packing also makes an update that only carries what changed.
          .tools/vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" --outputDir dist ||
            echo "No earlier release to make a smaller update from."
          .tools/vpk pack \
            --packId AgentOrange \
            --packTitle "Agent Orange" \
            --packVersion "$AGENT_ORANGE_VERSION" \
            --packDir publish \
            --mainExe AgentOrange.exe \
            --outputDir dist
          rm dist/*-Portable.zip # Portable copies can't update themselves, and updates are mandatory.
          find dist -name 'AgentOrange-*-full.nupkg' ! -name "AgentOrange-$AGENT_ORANGE_VERSION-full.nupkg" -delete # Already published.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client
          path: dist/

  publish:
    needs: [version, server, client] # Nothing is published unless both sides built.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      AGENT_ORANGE_VERSION: ${{ needs.version.outputs.number }}
    steps:
      # Re-running an older run would otherwise publish its old build as the newest.
      - name: Check this is still the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "Not publishing: main has moved on to $head since this was built." >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$AGENT_ORANGE_VERSION" artifacts/server/* artifacts/client/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$AGENT_ORANGE_VERSION" \
            --notes "Built from $GITHUB_SHA"

      # Updates are required and nothing goes back, so only the newest release is kept. The server
      # and installed PCs only ever ask for the latest one.
      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' |
            { grep -vxF "v$AGENT_ORANGE_VERSION" || true; } |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
