[package]
name = "agent-orange-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-postgres = "0.7.18"
